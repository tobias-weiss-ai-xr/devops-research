# DevSecOps / DevOps news ingestion sources.
#
# Each source resolves to either:
#   - an RSS/Atom feed  : {"type": "rss", "url": "..."}
#   - an arXiv API query: {"type": "arxiv", "categories": ["cs.CR","cs.SE"], "max": 50}
#   - a GitHub releases feed for a repo ("type": "github", "repo": "owner/name")
#
# `category` is a coarse bucket used in the digest:
#   arxiv-paper | blog | changelog | discussion
# `weight` boosts relevance scoring for higher-trust sources.

sources:
  # ---------- Papers (arXiv / OpenAlex style) ----------
  - name: arxiv-cs-cr         # security/privacy (DevSecOps relevant)
    type: arxiv
    categories: ["cs.CR"]
    max: 40
    category: paper
    weight: 2.0
    min_topics: 1          # drop papers with no DevSecOps keyword hits

  - name: arxiv-cs-se          # software engineering / DevOps tooling
    type: arxiv
    categories: ["cs.SE", "cs.DC", "cs.NI"]
    max: 60
    category: paper
    weight: 1.6
    min_topics: 1

  - name: arxiv-aiops          # AIOps: AI for IT operations (precise query)
    type: arxiv
    categories: ["cs.AI", "cs.LG", "cs.SE", "cs.DC", "cs.SY"]
    query: 'abs:"aiops" OR abs:"root cause analysis" OR abs:"anomaly detection" OR abs:"llmops" OR abs:"agentic operations" OR abs:"incident prediction" OR abs:"log anomaly" OR abs:"auto-remediation" OR abs:"alert fatigue" OR abs:"event correlation" OR abs:"predictive scaling" OR abs:"cognitive operations"'
    max: 40
    category: paper
    weight: 1.8
    min_topics: 1

  # ---------- Tooling / changelog feeds ----------
  - name: github-releases-tools
    type: github
    repos:
      - "kubernetes/kubernetes"
      - "hashicorp/terraform"
      - "opentofu/opentofu"
      - "open-policy-agent/opa"
      - "anchore/syft"
      - "gitleaks/gitleaks"
      - "aquasecurity/trivy"
      - "bridgecrewio/checkov"
      - "argoproj/argo-cd"
      - "fluxcd/flux2"
      - "crossplane/crossplane"
    category: changelog
    weight: 1.2

  # ---------- Discussions / news ----------
  - name: lwn
    type: rss
    url: "https://lwn.net/headlines/rss"
    category: discussion
    weight: 2.0

  - name: hn-frontpage
    type: rss
    url: "https://hnrss.org/frontpage"
    category: discussion
    weight: 1.4
    min_topics: 1          # keep only DevSecOps-relevant HN items

  - name: reddit-devsecops
    type: rss
    url: "https://www.reddit.com/r/devsecops/.rss"
    category: discussion
    weight: 1.4
    delay: 6

  - name: reddit-devops
    type: rss
    url: "https://www.reddit.com/r/devops/.rss"
    category: discussion
    weight: 1.2
    delay: 6

  - name: lobsteers
    type: rss
    url: "https://lobste.rs/t/devops.rss"
    category: discussion
    weight: 1.5

  - name: cncf-blog
    type: rss
    url: "https://www.cncf.io/blog/feed/"
    category: discussion
    weight: 1.6

  - name: newstack
    type: rss
    url: "https://thenewstack.io/feed/"
    category: discussion
    weight: 1.6

  - name: kubernetes-blog
    type: rss
    url: "https://kubernetes.io/feed.xml"
    category: discussion
    weight: 1.5

  # ---------- Security research feeds (high signal) ----------
  - name: snyk-blog
    type: rss
    url: "https://snyk.io/blog/feed/"
    category: discussion
    weight: 1.8
    max_items: 15          # feed returns full archive; keep recent
    recent_days: 14         # only surface posts from the last 2 weeks

  - name: aqua-blog
    type: rss
    url: "https://www.aquasec.com/feed/"
    category: discussion
    weight: 1.7

  - name: mozilla-security
    type: rss
    url: "https://blog.mozilla.org/security/feed/"
    category: discussion
    weight: 1.5

  - name: projectzero
    type: rss
    url: "https://projectzero.google/feed.xml"
    category: discussion
    weight: 1.9          # highest signal vuln research

  - name: google-security
    type: rss
    url: "http://feeds.feedburner.com/GoogleOnlineSecurityBlog"
    category: discussion
    weight: 1.6

  # ---------- AIOps / intelligent-operations feeds ----------
  - name: sre-weekly
    type: rss
    url: "https://sreweekly.com/feed/"
    category: discussion
    weight: 1.7          # high-signal incident mgmt / reliability

  - name: grafana-blog
    type: rss
    url: "https://grafana.com/blog/index.xml"
    category: discussion
    weight: 1.6          # observability + ML-driven ops

  - name: dynatrace-blog
    type: rss
    url: "https://www.dynatrace.com/blog/feed/"
    category: discussion
    weight: 1.6          # AIOps vendor (anomaly detection, root-cause)

  - name: msft-devops
    type: rss
    url: "https://devblogs.microsoft.com/devops/feed/"
    category: discussion
    weight: 1.5

  - name: logz-blog
    type: rss
    url: "https://logz.io/blog/feed/"
    category: discussion
    weight: 1.6          # observability + AIOps

  - name: cisa-kev
    type: cisa_kev
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
    category: changelog
    weight: 2.0          # actionable: actively exploited vulns
    max_items: 40        # catalog is large; only most recent pass the dedup window
    recent_days: 14       # only newly-added exploited vulns surface each run

