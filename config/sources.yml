# How long (days) an item is "fresh" for recency scoring.
fresh_window_days: 3
# Discard items with relevance score below this.
min_score: 0.4
# Cap total items emitted in the digest.
max_digest_items: 60

# ── Anti-saturation controls ───────────────────────────────────────────────
#   default_recent_days: applied to RSS + catalog sources that omit recent_days.
#     0 = no date filter by default (normal blogs already return recent items;
#     only archive/catalog feeds opt in).  Prevents starving low-frequency,
#     high-signal feeds (e.g. Project Zero) while stopping Snyk's full archive
#     and CISA KEV's static catalog from recycling old items every run.
#   max_source_share: hard ceiling on one source's share of the digest slots.
default_recent_days: 0
max_source_share: 0.40